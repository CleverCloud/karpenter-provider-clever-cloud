# The karpenter.sh/do-not-disrupt annotation opts a pod out of voluntary
# disruption: Karpenter will not consolidate, drift or expire the node this
# pod runs on while the pod is alive.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: do-not-disrupt
spec:
  replicas: 0
  selector:
    matchLabels:
      app: do-not-disrupt
  template:
    metadata:
      labels:
        app: do-not-disrupt
      annotations:
        karpenter.sh/do-not-disrupt: "true"
    spec:
      terminationGracePeriodSeconds: 0
      affinity:
        nodeAffinity:
          # Karpenter-only: karpenter-core stamps karpenter.sh/nodepool on
          # every node it provisions and on no other, so requiring the label
          # to exist keeps these pods off pre-existing capacity on ANY CKE
          # topology. Selecting cluster-node-role=worker instead only worked
          # on ALL_IN_ONE, where the sole non-Karpenter node is the control
          # plane; elsewhere the pre-existing pool is worker nodes too and the
          # pods would land there without ever exercising Karpenter.
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: karpenter.sh/nodepool
                    operator: Exists
      containers:
        - name: do-not-disrupt
          image: registry.k8s.io/pause:3.10
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
