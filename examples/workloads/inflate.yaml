# Scale this deployment up and down to watch Karpenter provision and
# consolidate Clever Cloud nodes:
#   kubectl scale deployment inflate --replicas=3
# The node affinity keeps the pods off every node Karpenter did not create,
# so they always exercise Karpenter — on any CKE topology.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inflate
spec:
  replicas: 0
  selector:
    matchLabels:
      app: inflate
  template:
    metadata:
      labels:
        app: inflate
    spec:
      terminationGracePeriodSeconds: 0
      affinity:
        nodeAffinity:
          # Karpenter-only: karpenter-core stamps karpenter.sh/nodepool on
          # every node it provisions and on no other, so requiring the label
          # to exist keeps these pods off pre-existing capacity on ANY CKE
          # topology. Selecting cluster-node-role=worker instead only worked
          # on ALL_IN_ONE, where the sole non-Karpenter node is the control
          # plane; elsewhere the pre-existing pool is worker nodes too and the
          # pods would land there without ever exercising Karpenter.
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: karpenter.sh/nodepool
                    operator: Exists
      containers:
        - name: inflate
          image: registry.k8s.io/pause:3.10
          resources:
            requests:
              cpu: "1"
              memory: 1500Mi
