# Prefers (but does not require) the cheapest flavor through a preferred
# node affinity — the scheduler tries 2XS first and relaxes to other
# flavors when the preference cannot be satisfied.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prefer-small
spec:
  replicas: 0
  selector:
    matchLabels:
      app: prefer-small
  template:
    metadata:
      labels:
        app: prefer-small
    spec:
      terminationGracePeriodSeconds: 0
      affinity:
        nodeAffinity:
          # Karpenter-only: karpenter-core stamps karpenter.sh/nodepool on
          # every node it provisions and on no other, so requiring the label
          # to exist keeps these pods off pre-existing capacity on ANY CKE
          # topology. Selecting cluster-node-role=worker instead only worked
          # on ALL_IN_ONE, where the sole non-Karpenter node is the control
          # plane; elsewhere the pre-existing pool is worker nodes too and the
          # pods would land there without ever exercising Karpenter.
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: karpenter.sh/nodepool
                    operator: Exists
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: clever-cloud.com/flavor
                    operator: In
                    values: ["2XS"]
      containers:
        - name: prefer-small
          image: registry.k8s.io/pause:3.10
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
