# A PodDisruptionBudget bounds how Karpenter drains nodes during
# consolidation/drift: evictions stop whenever fewer than minAvailable
# replicas would remain, so node replacements roll through the fleet
# without breaking availability.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pdb-workload
spec:
  replicas: 0
  selector:
    matchLabels:
      app: pdb-workload
  template:
    metadata:
      labels:
        app: pdb-workload
    spec:
      terminationGracePeriodSeconds: 0
      affinity:
        nodeAffinity:
          # Karpenter-only: karpenter-core stamps karpenter.sh/nodepool on
          # every node it provisions and on no other, so requiring the label
          # to exist keeps these pods off pre-existing capacity on ANY CKE
          # topology. Selecting cluster-node-role=worker instead only worked
          # on ALL_IN_ONE, where the sole non-Karpenter node is the control
          # plane; elsewhere the pre-existing pool is worker nodes too and the
          # pods would land there without ever exercising Karpenter.
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: karpenter.sh/nodepool
                    operator: Exists
      containers:
        - name: pdb-workload
          image: registry.k8s.io/pause:3.10
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pdb-workload
spec:
  minAvailable: "50%"
  selector:
    matchLabels:
      app: pdb-workload
