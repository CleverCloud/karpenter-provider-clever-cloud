# This example NodePool only provisions the larger Clever Cloud flavors
# (M and up), excluding the small ones. Fewer, bigger nodes reduce the
# per-node daemonset overhead for dense workloads.
#
# NOTE: this pool needs quota headroom beyond the default organisation quota
# (40 vCPU / 40 GB RAM including the control plane). A 3-node S control plane
# alone leaves 16 vCPU / 4 GB for workers, not enough memory for any flavor
# listed here (M 16 GB, L 24 GB, XL 32 GB): ask Clever Cloud support for a
# quota raise before relying on it.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: large-instances
  annotations:
    kubernetes.io/description: "NodePool restricted to the larger flavors (M+)"
spec:
  template:
    spec:
      nodeClassRef:
        group: karpenter.clever-cloud.com
        kind: CleverNodeClass
        name: large-instances
      requirements:
        - key: node.kubernetes.io/instance-type
          operator: In
          values: ["M", "L", "XL"]
  # Sized to admit every flavor listed above, not to fit the default quota:
  # Karpenter never launches a flavor whose capacity exceeds the pool's
  # remaining limits, so a 16Gi memory limit would silently shut L and XL out
  # and leave this pool launching M only.
  limits:
    cpu: "32"
    memory: 64Gi
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 30s
---
apiVersion: karpenter.clever-cloud.com/v1alpha1
kind: CleverNodeClass
metadata:
  name: large-instances
spec:
  labels: {}
