# This example NodePool will provision general purpose instances across the
# Clever Cloud flavor catalog, always picking the cheapest flavor that fits,
# and consolidating nodes as soon as they are empty or underutilized. Its
# limits keep it to 2XS through M (see below).
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: general-purpose
  annotations:
    kubernetes.io/description: "General purpose NodePool for generic workloads"
spec:
  template:
    spec:
      nodeClassRef:
        group: karpenter.clever-cloud.com
        kind: CleverNodeClass
        name: general-purpose
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
      expireAfter: Never
  # Size these against the organisation quota (default 40 vCPU / 40 GB RAM,
  # control plane included): a 3-node S control plane alone consumes 24 vCPU
  # / 36 GB of it. Limits also filter flavors: Karpenter never launches one
  # whose capacity exceeds the pool's remaining limits, so at 16Gi this pool
  # never launches L or XL (24 and 32 GB). Raise memory to 32Gi or more and
  # cpu accordingly (L is 12 vCPU, XL 16, and each node counts against both),
  # quota permitting, to let them in.
  limits:
    cpu: "16"
    memory: 16Gi
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 30s
---
apiVersion: karpenter.clever-cloud.com/v1alpha1
kind: CleverNodeClass
metadata:
  name: general-purpose
  annotations:
    kubernetes.io/description: "Default CleverNodeClass"
spec:
  labels: {}
