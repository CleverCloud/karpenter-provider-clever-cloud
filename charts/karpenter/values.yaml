# -- Overrides the chart name used in resource names.
nameOverride: ""
# -- Overrides the full resource name prefix.
fullnameOverride: ""
# -- Additional labels added to every chart resource.
additionalLabels: {}

image:
  # -- Controller image repository. Official images are published to ghcr.io
  # by the release workflow on every v* tag.
  repository: ghcr.io/clevercloud/karpenter
  # -- Image tag. Defaults to the chart appVersion.
  tag: ""
  # -- Image digest; takes precedence over tag when set.
  digest: ""

imagePullPolicy: IfNotPresent
imagePullSecrets: []

serviceAccount:
  # -- Create the service account.
  create: true
  # -- Service account name (generated from the chart name when empty).
  name: ""
  annotations: {}

# -- Number of controller replicas. Leader election keeps one active.
replicas: 1
revisionHistoryLimit: 10

podLabels: {}
podAnnotations: {}
podSecurityContext:
  fsGroup: 65532

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

priorityClassName: system-cluster-critical

# -- Extra node selector for the controller pod. Empty by default: the
# placement guarantee lives in `affinity` below, which holds on every CKE
# topology. Anything set here is ANDed with that affinity, so it can only
# narrow placement further — never widen it onto Karpenter-managed nodes.
nodeSelector: {}

# -- Tolerations for the controller pod. No CKE node role carries a taint
# today, so the entry below is a no-op; it is shipped so that a topology which
# starts tainting the only nodes the controller could run on does not silently
# strand it in Pending. It must grant no access to Karpenter-managed nodes.
# Registered ones are excluded by `affinity`, but a node only gets
# `karpenter.sh/nodepool` when karpenter-core registers it: until then, and for
# good on the extra node of an externally resized NodeGroup (which never
# registers), the only thing keeping this pod off is the
# `karpenter.sh/unregistered:NoExecute` taint. Tolerating that taint, or
# tolerating everything (an empty key with `operator: Exists`), removes the
# placement guarantee just as replacing `affinity` does.
tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule

# -- Affinity for the controller pod. The default encodes the one rule that
# must never be weakened: Karpenter must not run on capacity it can itself
# deprovision, or it can delete the node it is running on.
#
# karpenter-core stamps `karpenter.sh/nodepool` on every node it provisions, so
# requiring that label to be ABSENT selects exactly the nodes Karpenter does
# not manage — on ALL_IN_ONE (where the control plane is an in-cluster node),
# on DEDICATED_COMPUTE and DISTRIBUTED (where it is not and only worker nodes
# exist), and on any topology added later. The rule deliberately names no
# topology: enumerating them is the same bug deferred to the next one.
#
# The window before karpenter-core stamps the label on a brand-new node is
# closed by the `karpenter.sh/unregistered:NoExecute` taint the provider puts
# on every NodeGroup it creates, which this pod does not tolerate (see
# `tolerations`). The same taint keeps it off the extra node of an externally
# resized NodeGroup, which never registers and, once the providerid controller
# has stripped any copy an older NodeGroup payload left on it, does not carry
# the label.
#
# Overriding this value removes the guarantee — narrow it with `nodeSelector`
# instead.
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: karpenter.sh/nodepool
              operator: DoesNotExist

topologySpreadConstraints: []

controller:
  metrics:
    port: 8080
  healthProbe:
    port: 8081
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      memory: 512Mi
  # -- Extra environment variables for the controller container.
  env: []

settings:
  # -- Clever Cloud region/zone advertised on instance types (CKE is
  # Paris-only today).
  region: par
  # -- Log verbosity: debug, info or error.
  logLevel: info
  # -- Disable leader election (useful for single-replica dev setups).
  disableLeaderElection: false
  # -- Maximum/idle batching windows for pod batching before provisioning.
  batchMaxDuration: 10s
  batchIdleDuration: 1s
  featureGates:
    # -- Enable Karpenter's node auto-repair (acts on the provider's
    # RepairPolicies: NodeReady False/Unknown tolerated 10m).
    nodeRepair: false
  # -- Per-flavor overrides overlaid on top of the built-in catalogue (the
  # 2XS…XL seed). Leave empty to use the built-in catalogue unchanged. Each
  # entry needs a `name` (as accepted by the Clever Cloud NodeGroup API,
  # uppercase); `cpu` (vCPUs) and `memoryKi` (kernel-visible memory in KiB)
  # are OPTIONAL — set only the fields you want to pin, the rest fall through
  # to the built-in value. A name absent from the built-in catalogue must
  # supply both. There is no price field: every flavor's price is a unitless
  # cost derived from its cpu and memoryKi (2XS = 1), so pinning memoryKi
  # reprices the flavor. Pin every flavor the same way, or none: a single
  # pinned flavor can make consolidation rank sets of nodes differently from
  # what CKE bills (see the README's Flavor catalogue). Overrides always win.
  # CPU/memory still self-correct at runtime from observed node capacity.
  # Rendered into a ConfigMap mounted in the controller.
  # Example (pin every flavor's memory to what its nodes report on the current
  # CKE image, keep their cpu):
  #   flavors:
  #     - { name: 2XS, memoryKi: 3715344 }
  #     - { name: XS, memoryKi: 7553664 }
  #     - { name: S, memoryKi: 11385832 }
  #     - { name: M, memoryKi: 15229256 }
  #     - { name: L, memoryKi: 22896304 }
  #     - { name: XL, memoryKi: 30584176 }
  flavors: []

service:
  # -- Expose the metrics endpoint through a ClusterIP service.
  enabled: true
  annotations: {}
