name: InstallDependencies
description: 'Installs Go from go.mod with module and build caching'
inputs:
  use-cache:
    description: 'Whether to cache dependencies'
    default: 'true'
runs:
  using: "composite"
  steps:
    - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        cache: ${{ inputs.use-cache == 'true' }}
        go-version-file: go.mod
        check-latest: true
        cache-dependency-path: "**/go.sum"
